name: Managed SSH Git acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install disposable server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server openssh-client
          ssh -V
          git --version

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install locked backend dependencies
        run: poetry sync --no-interaction

      - name: Exercise real agent-authenticated Git and host trust
        env:
          SECOND_BRAIN_SSH_ACCEPTANCE: "1"
        run: |
          mkdir -p ../.demo
          poetry run pytest tests/integration/test_managed_ssh_git.py -v --junitxml=../.demo/managed-ssh.xml

      # Never retain the temporary credentials, sockets, server logs or vaults.
      - name: Upload synthetic SSH acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-ssh-${{ github.run_id }}-${{ github.run_attempt }}
          path: .demo/managed-ssh.xml
          if-no-files-found: warn
          retention-days: 7
