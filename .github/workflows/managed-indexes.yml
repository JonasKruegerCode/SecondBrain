name: Managed index acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install locked backend dependencies
        run: poetry sync --no-interaction

      - name: Run synthetic managed index integration tests
        env:
          SECOND_BRAIN_RUN_INDEX_INTEGRATION: "1"
        run: |
          mkdir -p ../.demo
          poetry run pytest tests/integration/test_managed_indexes.py -v --junitxml=../.demo/managed-indexes.xml

      # Only the synthetic test report is retained: no vaults, environment
      # files, container dumps, or external model credentials are uploaded.
      - name: Upload synthetic integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-indexes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .demo/managed-indexes.xml
          if-no-files-found: warn
          retention-days: 7
