name: Managed wiki browser acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install poetry==2.1.3
          poetry sync --no-interaction
          echo "WIKI_PYTHON=$(poetry env info --executable)" >> "$GITHUB_ENV"

      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Exercise the real disposable wiki and browser
        run: make acceptance PYTHON="$WIKI_PYTHON"

      - name: Exercise empty first start and real service restart
        run: make acceptance-first-start PYTHON="$WIKI_PYTHON"

      - name: Exercise local Git import and preserved browser edits
        run: make acceptance-import PYTHON="$WIKI_PYTHON"

      - name: Exercise reading and navigation in WebKit
        run: '"$WIKI_PYTHON" scripts/run-wiki-acceptance.py --browser-engine webkit'

      # Only synthetic structural evidence and screenshots; never archive a vault.
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .demo/acceptance/*/result.json
            .demo/acceptance/*/browser.log
            .demo/browser-results/**/*.png
            .demo/acceptance/*/browser-*/**/*.png
          if-no-files-found: warn
          retention-days: 7
