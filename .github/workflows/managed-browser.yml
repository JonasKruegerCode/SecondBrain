name: Managed wiki browser acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pwa_first_install_diagnostic:
        description: "Run bounded WebKit first-install diagnosis (20 cases; not full acceptance)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Match the locked Playwright version. System libraries and both browser
    # binaries are preinstalled; do not spend the suite's budget on apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install poetry==2.1.3
          poetry sync --no-interaction
          echo "WIKI_PYTHON=$(poetry env info --executable)" >> "$GITHUB_ENV"

      - name: Install locked browser packages and verify the prebuilt browsers
        working-directory: frontend
        run: |
          npm ci
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium, webkit } = require('playwright');
          assert.equal(require('@playwright/test/package.json').version, '1.64.0',
            'Update the CI image together with the locked Playwright version');
          for (const browser of [chromium, webkit]) {
            assert.ok(fs.existsSync(browser.executablePath()),
              `Missing prebuilt ${browser.name()} binary`);
          }
          JS

      - name: Check native WebKit chat and preference transactions before full suites
        run: '"$WIKI_PYTHON" scripts/run-wiki-acceptance.py --browser-engine webkit --browser-grep "overlapping native tab|concurrent initial migration|failed first migration|transaction abort after put|a received answer|start-preference" --repeat-each 3'

      - name: Exercise the real disposable wiki and browser
        run: make acceptance PYTHON="$WIKI_PYTHON"

      - name: Exercise empty first start and real service restart
        run: make acceptance-first-start PYTHON="$WIKI_PYTHON"

      - name: Exercise local Git import and preserved browser edits
        run: make acceptance-import PYTHON="$WIKI_PYTHON"

      - name: Exercise the real synthetic320 graph and browser history
        run: make acceptance-scale PYTHON="$WIKI_PYTHON"

      - name: Exercise reading and navigation in WebKit
        run: '"$WIKI_PYTHON" scripts/run-wiki-acceptance.py --browser-engine webkit'

      - name: Exercise worker registration and protected updates in WebKit
        run: '"$WIKI_PYTHON" scripts/run-wiki-acceptance.py --browser-engine webkit --webkit-workers'

      - name: Diagnose intermittent WebKit first installation (opt-in)
        if: inputs.pwa_first_install_diagnostic || contains(github.event.pull_request.labels.*.name, 'diagnose-pwa-first-install')
        run: '"$WIKI_PYTHON" scripts/run-wiki-acceptance.py --browser-engine webkit --webkit-first-install-diagnostic --repeat-each 20'

      # Only synthetic structural evidence and screenshots; never archive a vault.
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .demo/acceptance/*/result.json
            .demo/acceptance/*/browser.log
            .demo/browser-results/**/*.png
            .demo/browser-results/**/attachments/galaxy-stability*.json
            .demo/browser-results/**/attachments/galaxy-link-mutation*.json
            .demo/acceptance/*/browser-*/**/*.png
            .demo/acceptance/*/browser-*/**/error-context.md
            .demo/acceptance/*/browser-*/**/attachments/galaxy-stability*.json
            .demo/acceptance/*/browser-*/**/attachments/galaxy-link-mutation*.json
          if-no-files-found: warn
          retention-days: 7

