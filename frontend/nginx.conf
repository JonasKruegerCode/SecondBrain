server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the worker so a waiting update can be offered promptly.
    # The worker intentionally has no fetch handler and never caches private data.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # In production, NPM handles this proxy. For local docker compose, proxy here.
    location /api/ {
        # Compose may replace the backend's address on restart. Resolve the stable
        # service name through Docker DNS at request time, with a bounded cache.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        set $wiki_backend backend:8000;
        # No URI suffix: preserve /api/, escaped path segments and query strings.
        proxy_pass http://$wiki_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
