# SecondBrain: complete Wiki-first application, using published images only.
# Copy this file and .env.example into an empty directory; no source checkout needed.
# Frontend, REST, MCP and the Neo4j/Qdrant retrieval databases start together.
# Git and index providers are shared by REST and MCP; only REST runs delivery.
x-vault-git: &vault-git
  SECOND_BRAIN_WIKI_GIT_SYNC: ${SECOND_BRAIN_WIKI_GIT_SYNC:-}
  # Omit the value to retain existing vault layout; empty deliberately selects repo root.
  SECOND_BRAIN_WIKI_GIT_PREFIX: ${SECOND_BRAIN_WIKI_GIT_PREFIX-1_knowledge/wiki}
  VAULT_GIT_URL: ${VAULT_GIT_URL:-}
  VAULT_GITHUB_URL: ${VAULT_GITHUB_URL:-}
  VAULT_GIT_BRANCH: ${VAULT_GIT_BRANCH:-}
  VAULT_GIT_PROVIDER: ${VAULT_GIT_PROVIDER:-github}
  VAULT_GIT_AUTH_METHOD: ${VAULT_GIT_AUTH_METHOD:-auto}
  VAULT_GIT_HTTP_USERNAME: ${VAULT_GIT_HTTP_USERNAME:-}
  VAULT_GIT_HTTP_ACCESS_TOKEN: ${VAULT_GIT_HTTP_ACCESS_TOKEN:-}
  VAULT_GIT_HTTP_TOKEN: ${VAULT_GIT_HTTP_TOKEN:-}
  VAULT_GITHUB_PAT: ${VAULT_GITHUB_PAT:-}
  VAULT_GIT_SSH_KEY_PATH: ${VAULT_GIT_SSH_KEY_PATH:-}
  VAULT_GIT_SSH_KEY: ${VAULT_GIT_SSH_KEY:-}
  VAULT_GIT_SSH_KNOWN_HOSTS_PATH: ${VAULT_GIT_SSH_KNOWN_HOSTS_PATH:-}

x-wiki-indexes: &wiki-indexes
  SECOND_BRAIN_WIKI_GRAPH_INDEX: ${SECOND_BRAIN_WIKI_GRAPH_INDEX:-}
  SECOND_BRAIN_WIKI_VECTOR_INDEX: ${SECOND_BRAIN_WIKI_VECTOR_INDEX:-}
  SECOND_BRAIN_WIKI_VECTOR_DIMENSION: ${SECOND_BRAIN_WIKI_VECTOR_DIMENSION:-}
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-secondbrain-local}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_CHAT_PROVIDER: ${OPENROUTER_CHAT_PROVIDER:-}
  OPENROUTER_EMBEDDING_PROVIDER: ${OPENROUTER_EMBEDDING_PROVIDER:-}
  GCP_API_KEY: ${GCP_API_KEY:-}
  GCP_ENDPOINT_URL: ${GCP_ENDPOINT_URL:-https://generativelanguage.googleapis.com/v1beta/openai}

services:
  backend:
    image: ${WIKI_BACKEND_IMAGE:-ghcr.io/jonaskruegercode/secondbrain-backend:latest}
    environment:
      <<: [*vault-git, *wiki-indexes]
      SECOND_BRAIN_WIKI_VAULT: /managed-vault
      DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek/deepseek-v4-flash}
    volumes:
      - managed_wiki:/managed-vault
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/wiki/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mcp:
    image: ${WIKI_MCP_IMAGE:-${WIKI_BACKEND_IMAGE:-ghcr.io/jonaskruegercode/secondbrain-backend:latest}}
    command: python -m uvicorn second_brain.wiki.mcp:http_app_factory --factory --host 0.0.0.0 --port 3001
    environment:
      <<: [*vault-git, *wiki-indexes]
      SECOND_BRAIN_WIKI_VAULT: /managed-vault
      SECOND_BRAIN_WIKI_API_KEY: ${SECOND_BRAIN_WIKI_API_KEY:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      SECOND_BRAIN_WIKI_MCP_ALLOWED_HOSTS: "${SECOND_BRAIN_WIKI_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}"
      SECOND_BRAIN_WIKI_MCP_ALLOWED_ORIGINS: "${SECOND_BRAIN_WIKI_MCP_ALLOWED_ORIGINS:-http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*}"
      SECOND_BRAIN_WIKI_DELIVERY: "0"
    volumes:
      - managed_wiki:/managed-vault
    ports:
      - "127.0.0.1:${WIKI_MCP_PORT:-${MCP_PORT:-3001}}:3001"
    restart: unless-stopped

  frontend:
    image: ${WIKI_FRONTEND_IMAGE:-ghcr.io/jonaskruegercode/secondbrain-frontend:latest}
    ports:
      - "127.0.0.1:${WIKI_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Retrieval databases. Private to the Compose network, no published ports and
  # no healthchecks, so `up --wait` returns once the wiki app is healthy even
  # while these are still starting. Indexes may remain pending after startup.
  neo4j:
    image: neo4j:5.26.33@sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-secondbrain-local}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  managed_wiki:
  neo4j_data:
  qdrant_data:
