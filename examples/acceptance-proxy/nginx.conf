# Acceptance fixture only. Its password and certificate are deliberately disposable.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/fixture/cert.pem;
    ssl_certificate_key /etc/nginx/fixture/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Synthetic wiki acceptance";
    auth_basic_user_file /etc/nginx/fixture/passwords;
    # The fixture must follow service addresses after Compose restarts too.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    location / {
        set $wiki_frontend frontend:80;
        proxy_pass http://$wiki_frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Browser password is checked here, never forwarded into the wiki.
        proxy_set_header Authorization "";
    }

    # MCP has its own Bearer gate. Basic and Bearer cannot share one auth header.
    location = /mcp {
        auth_basic off;
        set $wiki_mcp mcp:3001;
        proxy_pass http://$wiki_mcp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
    }
}
