# Managed Wiki 2.0 preview. Legacy Compose and production volumes are unchanged.
# Existing vault Git ENV is shared by REST and MCP; only REST runs delivery.
x-vault-git: &vault-git
  SECOND_BRAIN_WIKI_GIT_SYNC: ${SECOND_BRAIN_WIKI_GIT_SYNC:-}
  VAULT_GIT_URL: ${VAULT_GIT_URL:-}
  VAULT_GITHUB_URL: ${VAULT_GITHUB_URL:-}
  VAULT_GIT_BRANCH: ${VAULT_GIT_BRANCH:-}
  VAULT_GIT_PROVIDER: ${VAULT_GIT_PROVIDER:-github}
  VAULT_GIT_AUTH_METHOD: ${VAULT_GIT_AUTH_METHOD:-auto}
  VAULT_GIT_HTTP_USERNAME: ${VAULT_GIT_HTTP_USERNAME:-}
  VAULT_GIT_HTTP_ACCESS_TOKEN: ${VAULT_GIT_HTTP_ACCESS_TOKEN:-}
  VAULT_GIT_HTTP_TOKEN: ${VAULT_GIT_HTTP_TOKEN:-}
  VAULT_GITHUB_PAT: ${VAULT_GITHUB_PAT:-}
  VAULT_GIT_SSH_KEY_PATH: ${VAULT_GIT_SSH_KEY_PATH:-}
  VAULT_GIT_SSH_KEY: ${VAULT_GIT_SSH_KEY:-}
  VAULT_GIT_SSH_KNOWN_HOSTS_PATH: ${VAULT_GIT_SSH_KNOWN_HOSTS_PATH:-}

services:
  backend:
    build: ./backend
    command: python -m uvicorn second_brain.wiki.api:app_factory --factory --host 0.0.0.0 --port 8000
    environment:
      <<: *vault-git
      SECOND_BRAIN_WIKI_VAULT: /managed-vault
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek/deepseek-v4-flash}
    volumes:
      - managed_wiki:/managed-vault
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/wiki/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mcp:
    build: ./backend
    command: python -m uvicorn second_brain.wiki.mcp:http_app_factory --factory --host 0.0.0.0 --port 3001
    environment:
      <<: *vault-git
      SECOND_BRAIN_WIKI_VAULT: /managed-vault
      SECOND_BRAIN_WIKI_API_KEY: ${SECOND_BRAIN_WIKI_API_KEY:-}
      SECOND_BRAIN_WIKI_MCP_ALLOWED_HOSTS: "${SECOND_BRAIN_WIKI_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}"
      SECOND_BRAIN_WIKI_MCP_ALLOWED_ORIGINS: "${SECOND_BRAIN_WIKI_MCP_ALLOWED_ORIGINS:-http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*}"
      SECOND_BRAIN_WIKI_DELIVERY: "0"
    volumes:
      - managed_wiki:/managed-vault
    ports:
      - "127.0.0.1:${WIKI_MCP_PORT:-3001}:3001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WIKI_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  managed_wiki:

