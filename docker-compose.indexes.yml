# Optional local derived-index databases, alongside the same application.
# Set NEO4J_PASSWORD and an embedding key in .env before enabling vectors.
# docker compose -f docker-compose.yml -f docker-compose.indexes.yml up -d --wait
x-index-endpoints: &index-endpoints
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a database password in .env}
  QDRANT_URL: http://qdrant:6333
services:
  backend:
    environment:
      <<: *index-endpoints
  mcp:
    environment:
      <<: *index-endpoints
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set a database password in .env}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
volumes:
  neo4j_data:
  qdrant_data:
